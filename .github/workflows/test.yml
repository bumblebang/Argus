name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ops golden (G0)
        run: python -m pytest -m ops_golden
        env:
          DRY_RUN: "true"
      - name: Design alignment (plan ↔ config/code)
        run: python scripts/check_design_alignment.py
      - name: Protected change guard (J13)
        run: python scripts/check_protected_changes.py --base ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
        env:
          GITHUB_PR_BODY: ${{ github.event.pull_request.body }}
      - name: Test
        run: python -m pytest
        env:
          DRY_RUN: "true"
