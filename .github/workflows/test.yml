name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ops golden (G0)
        run: python -m pytest -m ops_golden
        env:
          DRY_RUN: "true"
      - name: Test
        run: python -m pytest
        env:
          DRY_RUN: "true"
