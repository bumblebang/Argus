# 자격증명은 여기 두지 말고 .env 에 둔다.
# 이 파일을 config.yaml 로 복사한 뒤 자본·한도를 본인 계좌에 맞춘다.
# 기본은 페이퍼. 라이브는 docs/SETUP_LIVE.md.

run:
  dry_run: true
  poll_interval_sec: 60
  request_spacing_sec: 0.3
  timezone: "Asia/Seoul"
  trade_markets: ["KR", "US"]

# 실주문은 3중: broker.mode==live AND dry_run==false AND .env DRY_RUN=false.
# 그리고 watch 데몬이 live_client 를 주입한 프로세스만 실주문 가능(배치 스크립트는 페이퍼).
broker:
  mode: "paper"          # paper | live
  account_seq: 1         # doctor 가 조회한 계좌 seq 로 맞출 것
  live_markets: ["KR", "US"]   # 실주문 허용. 주문 절대캡은 max_order_notional(기본 {}).
  limit_slippage_pct: 0.01
  reconcile_poll_attempts: 5
  reconcile_poll_sec: 0.4
  reconcile_sec: 300
  max_spread_pct_extended: 0.02
  # 접수 후 원장 미반영 주문(예약) 강제 회수 시간. 해제 누락 시 매수 영구 차단 방지.
  reservation_ttl_sec: 300
  # 미체결 주문 방치 시간(초). 넘으면 취소. 0=즉시취소, 음수=취소 안 함.
  # 즉시취소는 얇은 호가·시간외에서 정상 체결 기회를 버린다.
  working_order_ttl_sec: 60
  # 같은 종목에 미체결 주문이 살아 있으면 재발주 거부(매 틱 중복 발주 차단).
  block_on_working_order: true
  # 종결된 체결분을 원장 귀속(실체결가 기입)까지 보관하는 시간(초). 재대사가 수량
  # 감소를 못 보면 만료 회수하고 unattributed_fill 을 남긴다. 음수=무제한.
  attribution_ttl_sec: 1800
  # 미체결(진행 중) 행 강제 회수(초). 취소 실패·조회 불능이어도 넘으면 레지스트리
  # 삭제 + working_order_abandoned 경보. 한 행이 매수여력을 영구 홀드해 전 종목
  # 매수가 죽는 구멍 방지. 0=즉시, 음수=비활성(구동작).
  working_order_abandon_ttl_sec: 1800

trading_sessions:
  KR: [regular, premarket, aftermarket]
  US: [regular, premarket, aftermarket]

trailing:
  enabled: true
  base_pct: 0.05
  regime_mult:
    risk_off: 0.6
    neutral: 1.0
    risk_on: 1.6
  horizons: [swing, position]

# 공통 청산 바닥 — 전략 decide() 와 무관. day 는 watch.session_end_exit_min 이 담당.
exit_policy:
  enabled: true
  time_stop:
    enabled: true
    by_horizon:
      swing: { max_days: 20 }
      position: { max_days: 120 }
    exclude_strategy: ["value"]

watch:
  watch_interval_sec: 1
  idle_interval_sec: 60
  candle_ttl_sec: 8
  precision_per_tick: 3
  strategy_per_tick: 3
  entry_per_tick: 3
  vol_window: 12
  vol_spike_pct: 0.05
  stop_buffer_pct: 0.005
  stale_quote_sec: 600
  brain_backend: "cli"       # cli | live | dry
  brain_interval_sec: 0        # 정각 스케줄은 extra_wakes 전용(상대 주기 끔)
  brain_cooldown_sec: 300
  circuit_fail_threshold: 2
  brain_sessions:
    KR: [premarket, regular, aftermarket]   # 19:50 nxt_gap_scan
    US: [premarket, regular]   # 17:00 프리 extra
  extra_wakes:
    KR: ["08:00", "09:00", "11:00", "13:00", "15:15", "15:20", "19:50"]  # 15:15 pool / 15:20 gap_rebound_scan
    US: ["17:00", "22:30", "00:30", "02:30", "04:30"]   # KST, EDT 기준(썸머타임 ±1h 수동)
  extra_wake_state_path: "data/state/extra_wake_fired.json"
  extra_wake_grace_sec: 120     # 재기동 직후 extra 억제
  extra_wake_window_min: 5       # HH:MM 후 5분 창 — 지나면 그날 catch-up 안 함
  wake_request_path: "data/state/brain_wake_request.json"
  session_end_exit_min: 5
  dashboard: true
  dashboard_port: 8787
  market_state_refresh: true
  market_state_refresh_sec: 300
  account_snapshot_sec: 300

alerts:
  ntfy_topic: ""             # .env NTFY_TOPIC 이 우선

risk:
  # 배정 자본 — 손실예산(SoD) 폴백. 라이브는 capital_sync 가 재대사마다 equity 로 맞춤.
  capital:
    KR: 2000000
    US: 725
  capital_sync:
    enabled: true
    min_change_pct: 0.02
    min_change_abs: {KR: 10000, US: 10}
  # 사이징: weight = base_position_pct × (floor + span × conviction)
  sizing_base: "equity"      # equity=실자산(현금+평가) | capital=고정 capital
  base_position_pct: 0.20    # 기본 목표 비중(총자산 대비)
  max_position_pct: 0.25     # 한 종목 하드 상한
  conviction_size_floor: 0.75
  conviction_size_span: 0.25 # floor+span=1.0 이면 확신 1에서 base 전량
  max_positions: {KR: 5, US: 5}  # 시장별 슬롯(스칼라 int면 KR=US 동일). value_trade.max_positions 는 슬리브 로컬
  daily_loss_limit_pct: 0.05 # SoD equity 대비
  # 일손실 판정에 SoD equity 델타도 반영(realized 를 우회한 체결을 잡음).
  # false 면 실현손익만 본다(구 동작).
  daily_loss_use_sod_delta: true
  allow_fractional: false
  # 최소 1주 시범매수: 고단가 종목이 목표비중 floor=0 으로 영구 탈락하는 구멍 보완.
  # 면제: 주문상한 + 종목비중(첫 1주만). 현금·gross·섹터·보유수는 그대로.
  # 이미 보유 중인 종목에는 면제하지 않는다(보유 에피소드당 1회 시범).
  allow_min_lot: true
  min_lot_qty: 1.0
  # 시범매수 절대 상한(원). null=비활성. 스칼라 또는 {KR: 300000} 형태.
  min_lot_max_notional: null
  max_gross_exposure: 0.90
  max_sector_pct: 0.40
  max_drawdown_pct: null     # 비활성. 숫자면 SoD 대비 DD 매수차단
  exposure_base: "equity"
  max_order_notional: {}     # BUY 절대캡. {}=KR/US 공통 비활성. 예: {KR: 500000, US: 500}
  kill_switch_file: "data/state/HALT"  # 전역: BUY/SELL 전부. 마켓 pause=HALT.KR / HALT.US (BUY만)
  # KRX 경보 종목 BUY 하드스킵 (build_market_state 가 갱신)
  blocked_symbols_file: "data/krx_blocked_symbols.json"

paper:
  cash:
    KR: 1000000              # 페이퍼 시작 현금. 라이브에선 실계좌 미러로 덮임
    US: 0
  fee_rate:
    KR: 0.00015
    US: 0.001
  slippage_bps:
    KR: 5
    US: 5
  sell_tax_rate:
    KR: 0.0015
    US: 0.0

market_state:
  regime_symbols:
    KR: ["069500", "229200"]
    US: ["SPY", "QQQ"]
  regime_symbols_yahoo:
    KR: ["^KS11", "^KQ11"]
    US: ["^GSPC", "^IXIC"]
  breadth_min_n: 10
  fear_greed:
    enabled: true
    ttl_sec: 1800
    kr_proxy: true
    kr_index: "^KS11"
    kr_drawdown_lookback: 20
    kr_drawdown_max_age_hours: 6
    history: true
    history_path: "data/fear_history.json"
    # KRX Open API(KRX_API_KEY) — VKOSPI·풋콜을 fear_kr.inputs 에만 붙임(점수 가중치 불변)
    krx_enrich: true
    krx_cache_path: "data/krx_fear_cache.json"
    krx_ttl_sec: 21600
  request_spacing_sec: 0.6
  sec_user_agent: "Argus your-email@example.com"
  fundamentals_max: 10
  # Finnhub 종목뉴스 상한(보유·armed 우선 + 유니버스 패딩). free tier pacing 고려.
  news_us_max: 20
  sector_symbols:
    US:
      Technology: "XLK"
      Financials: "XLF"
      Energy: "XLE"
      HealthCare: "XLV"
      Discretionary: "XLY"
      Staples: "XLP"
      Industrials: "XLI"
      Utilities: "XLU"
      Materials: "XLB"
      Communication: "XLC"
    KR:
      반도체: "091160"
      은행: "091170"
      자동차: "091180"
      증권: "102970"
      헬스케어: "266420"
      2차전지: "305720"
  news_feeds:
    한국경제: "https://www.hankyung.com/feed/finance"
    연합뉴스: "https://www.yna.co.kr/rss/economy.xml"
    매일경제: "https://www.mk.co.kr/rss/30000001/"
    investing: "https://kr.investing.com/rss/news_25.rss"
  sentiment_symbols:
    vix: "^VIX"
  markets_symbols:
    KOSPI: "^KS11"
    KOSDAQ: "^KQ11"
    SP500: "^GSPC"
    NASDAQ: "^IXIC"
    Gold: "GC=F"
    WTI: "CL=F"
    BTC: "BTC-USD"
    USDKRW: "KRW=X"

agents:
  model: "claude-opus-4-8"
  min_conviction: 0.6
  brain_min_conviction: 0
  conviction_code: true
  require_dossier: true
  entry_zone_guard: true
  entry_zone_tolerance_pct: 0.005
  conviction_sizing: true
  min_lot_conviction: 0.6
  lessons: true
  # 정기=전량 서빙, 이벤트=보유∪wake shortlist(+온디맨드 수급). 느린슬롯 전량 장중 갱신 없음.
  serve:
    enabled: true
    focus_cap: 16
    focus_pad: 0
    ondemand_flows: true
    ondemand_news: false
    focus_headline_limit: 40
    compact_json: true
    enrich_fundamentals: true
    enrich_flows: true
    gap_enrich_max: 25
    patch_missing_fundamentals_max: 5
  max_tokens: 8000
  thinking: true
  claude_command: "claude"
  claude_model: "opus"
  claude_val_model: "opus"
  claude_fallback_model: "sonnet"
  # 결정 LLM wake 라우팅: 아래 opus 슬롯·reason 만 opus, 나머지(이벤트·extra·periodic) sonnet. 검증=claude_val_model 고정.
  brain_decision:
    enabled: true
    opus_model: "opus"
    sonnet_model: "sonnet"
    opus_reasons: ["athena_done", "gap_rebound_scan", "nxt_gap_scan"]
    opus_extra_slots:
      KR: ["08:00", "09:00"]
      US: ["22:30"]
  claude_timeout: 600
  cursor_bridge:
    enabled: false
    inbox_dir: "data/inbox"
    timeout_sec: 1200
    poll_sec: 1.0
    require_armed: true
    armed_max_age_sec: 90
  # 클코 세션 추정 %(JSONL 합÷cap). 공식 /usage 아님. Pro~$20·5h 커뮤니티 추정치.
  claude_budget:
    enabled: true
    session_token_cap: 44000
    session_window_sec: 18000
  val_model: "claude-opus-4-8"

watcher:
  enabled: true
  dart_poll_sec_active: 10
  dart_poll_sec_idle: 60
  active_after_close_hours: 2
  earnings_consensus: true
  imminent_after_close_hours: 4
  earnings_result: true
  earnings_poll_sec: 600
  earnings_idle_poll_sec: 3600
  edgar: true
  edgar_poll_sec_active: 120
  edgar_poll_sec_idle: 900
  edgar_lookback_days: 3
  edgar_after_close_hours: 2

athena:
  model: "sonnet"
  max_per_run: 30
  ttl_hours: 60
  timeout: 240
  windows:
    KR:
      - { start: "05:30", stop: "07:30" }   # 종료 직후 athena_done → 뇌 1회
    # 방향4-A: US 도지어만(집행/brain_sessions.US 미개방). 태스크 17:10.
    US:
      - { start: "17:00", stop: "21:50" }

screener:
  enabled: true
  universe_max_age_hours: 192
  history_range: "6mo"
  candle_interval: "1d"
  lookback: 60
  exclude_warnings: true
  min_price: { KR: 2000, US: 5 }
  max_price: { KR: 1000000, US: 2000 }
  min_avg_turnover: { KR: 5000000000, US: 50000000 }
  gems:
    enabled: true
    count_per_market: { KR: 5, US: 3 }
    pool: 150
    min_avg_turnover: { KR: 1000000000, US: 20000000 }
    drawdown_range: [-0.60, -0.25]
    knife_20d_min: -0.10
    box_momentum_max: 0.10
    min_trades: 3
  picks:
    volatility_breakout: { count: 4, rank_by: "volatility" }
    ma_crossover:        { count: 4, rank_by: "momentum" }
    rsi_reversion:       { count: 4, rank_by: "liquidity" }
  rolling:
    enabled: true
    movers_enabled: false
    interval_min: 60
    movers_per_scan: 3
    mover_max_per_market: 6
    core_weekdays: [0]
    core_preopen_min: { KR: 90, US: 330 }
    picks_scale: { KR: 1.0, US: 1.5 }

day_pool:
  enabled: true
  markets: ["KR"]
  count: 50
  type: "MARKET_TRADING_AMOUNT"
  duration_live: "realtime"
  duration_fallback: "1d"
  strategy: "volatility_breakout"

gap_decline_pool:
  enabled: true
  markets: ["KR"]
  liquidity_top: 300
  decline_top: 100
  strategy: "rsi_reversion"

universe:
  KR:
    - { symbol: "005930", name: "삼성전자",    strategy: "volatility_breakout", sector: "반도체" }
    - { symbol: "000660", name: "SK하이닉스",  strategy: "ma_crossover",        sector: "반도체" }
    - { symbol: "035720", name: "카카오",      strategy: "rsi_reversion",       sector: "인터넷" }
  US:
    - { symbol: "AAPL",   name: "Apple",       strategy: "volatility_breakout", sector: "하드웨어" }
    - { symbol: "MSFT",   name: "Microsoft",   strategy: "ma_crossover",        sector: "소프트웨어" }
    - { symbol: "NVDA",   name: "Nvidia",      strategy: "rsi_reversion",       sector: "반도체" }

strategies:
  volatility_breakout:
    candle_interval: "1d"
    k: 0.5
    target_profit_pct: 0.03
    stop_loss_pct: 0.02
    exit_at_session_end: true
  ma_crossover:
    candle_interval: "1d"
    short: 5
    long: 20
  rsi_reversion:
    candle_interval: "1d"
    period: 14
    oversold: 30
    overbought: 70

value_scan:
  enabled: true
  markets: ["KR", "US"]
  pool: 600
  pool_us: 400
  min_avg_turnover:
    KR: 500000000
    US: 3000000
  max_per_run: 15               # 평일 2회(여·닫) ×15 ≈ 30콜/일
  ttl_hours: 400
  refresh_hours: 20
  refresh_slots: 2              # 보유 우선 재검증
  weekend_refresh: true
  weekend_max_per_run: 16       # 토 10:00 1회 지도 재감정. 일 없음
  news_per_symbol: 3
  model: "sonnet"
  timeout: 240

value_trade:
  enabled: true
  sleeve_pct: 0.60
  brain_reserve_pct: 0.30
  max_per_run: 2
  max_positions: 3
  min_dossier_conviction: 0.4
  dossier_ttl_hours: 400
  hard_stop_pct: 0.20
  time_stop_days: 120
  tranche_min_days: 7
  markets: ["KR", "US"]
  model: "fable"
  timeout: 600
  windows: { KR: "10:00", US: "23:00" }

# 기본 기동 경로가 아님. 켜려면 docs 를 보고 enabled 를 true 로.
public_page:
  enabled: false
  out: "public/index.html"
  brief_model: "sonnet"
  brief_timeout: 180
  brief_ttl_hours: 20
  publish:
    enabled: false
    repo_dir: ""
    remote: ""
    branch: "main"
    single_commit: true
